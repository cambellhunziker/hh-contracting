  <text font-family="Oswald, 'Arial Narrow', sans-serif" font-weight="500" font-size="11" letter-spacing="0.6" fill="#F2F2EF"><textPath href="#sealArc" startOffset="8" textLength="189" lengthAdjust="spacingAndGlyphs">CONSTRUCTION · CONSULTING</textPath></text>
  <circle cx="56" cy="118" r="2" fill="#D9541E"/>
  <circle cx="70" cy="120" r="2" fill="#D9541E"/>
