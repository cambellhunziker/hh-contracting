  <text x="70" y="99" text-anchor="middle" font-family="Oswald, 'Arial Narrow', sans-serif" font-weight="500" font-size="7.5" letter-spacing="1.4" textLength="52" lengthAdjust="spacingAndGlyphs" fill="#F2F2EF">CONTRACTING</text>
</svg>
